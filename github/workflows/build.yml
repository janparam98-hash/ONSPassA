name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Unzip project
        run: unzip -q ONSPassAI.zip -d project
      - name: Build debug APK
        run: |
          DIR=$(dirname "$(find project -name 'settings.gradle*' | head -n 1)")
          cd "$DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ONSPassAI-apk
          path: project/**/*.apk
